# ==========================================
# 80 端口 HTTP -> 443 HTTPS 强制无条件重定向
# ==========================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 任何 HTTP 访问一律返回 301 永久重定向至安全加密 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==========================================
# 443 端口 HTTPS 核心业务反向代理与安全防护网关
# ==========================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL 证书配置 (推荐使用 Cloudflare 15年 Origin CA 证书或 Let's Encrypt 证书)
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # 现代 TLS 协议与加密套件
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # ==========================================
    # 安全加固响应头 (Security Headers)
    # ==========================================
    # 强制客户端浏览器在未来 1 年内必须采用 HTTPS 访问 (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # 禁止 MIME 类型嗅探攻击
    add_header X-Content-Type-Options "nosniff" always;
    # 防点击劫持：同源策略下允许嵌入
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 启用浏览器内建 XSS 过滤器
    add_header X-XSS-Protection "1; mode=block" always;
    # 隐私防泄漏 Referrer 策略
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==========================================
    # 1. 登录与注册敏感接口：高防暴破限流区
    # ==========================================
    location ~* ^/api/auth/(login|register)$ {
        limit_req zone=login_limit burst=5 nodelay;

        proxy_pass http://shop-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # ==========================================
    # 2. REST API 业务接口通用路由与通用限流
    # ==========================================
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://shop-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # ==========================================
    # 3. 用户上传的静态图片/文件直出 (高性能零拷贝)
    # ==========================================
    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # ==========================================
    # 4. 前端 Vue 3 单页应用 (SPA) 路由代理
    # ==========================================
    location / {
        proxy_pass http://shop-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 禁止访问敏感隐藏文件 (.git, .env 等)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
