user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 隐藏 Nginx 详细版本号，防止黑客针对特定版本已知漏洞发起攻击
    server_tokens off;

    # 日志输出格式 (记录真实的客户端来源 IP)
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # 基础性能参数优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip 压缩优化传输带宽
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # ==========================================
    # 核心安全特性 1: Cloudflare 真实 IP 还原
    # 将 $remote_addr 还原为访客真实 IP，防止限流与日志被 CDN 节点 IP 污染
    # ==========================================
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    # Cloudflare IPv6 地址段
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    # 信任本地 Docker 网桥
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;

    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # ==========================================
    # 核心安全特性 2: 内存级频率限制 (Rate Limiting 防刷)
    # ==========================================
    # 登录/注册专用限流池：基于客户端真实 IP，限制每秒最多 5 次请求 (防暴力破解)
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

    # API 接口常规限流池：基于客户端真实 IP，限制每秒最多 30 次请求 (防恶意爬虫/DoS)
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=30r/s;

    # 超限时返回 HTTP 429 (Too Many Requests)
    limit_req_status 429;

    # 载入各站点虚拟主机配置
    include /etc/nginx/conf.d/*.conf;
}
