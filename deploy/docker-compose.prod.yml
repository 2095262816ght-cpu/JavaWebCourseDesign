version: '3.8'

# ========================================================
# 方案一生产环境容器编排 (全栈隔离 + 端口最小化收敛)
# ========================================================

networks:
  shop-internal:
    driver: bridge
    name: shop-internal-network

volumes:
  mysql_data:
    name: shop_prod_mysql_data
  redis_data:
    name: shop_prod_redis_data
  uploads_data:
    name: shop_prod_uploads_data
  logs_data:
    name: shop_prod_logs_data

services:
  # --------------------------------------------------------
  # 1. 持久层 MySQL 8.4 容器 (零外部端口暴露，仅允许内部通信)
  # --------------------------------------------------------
  shop-mysql:
    image: mysql:8.4
    container_name: shop-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-Shop_Prod_Root_Secret_2026!}
      MYSQL_DATABASE: ${DB_NAME:-shop_db}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ../docs/sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../docs/sql/data.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - shop-internal

  # --------------------------------------------------------
  # 2. 缓存层 Redis 7.2 容器 (密码鉴权 + 零外部端口暴露)
  # --------------------------------------------------------
  shop-redis:
    image: redis:7.2-alpine
    container_name: shop-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-Shop_Prod_Redis_Token_2026!} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-Shop_Prod_Redis_Token_2026!} ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - shop-internal

  # --------------------------------------------------------
  # 3. 业务层 Spring Boot 3 后端服务 (非 root 用户运行)
  # --------------------------------------------------------
  shop-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: shop-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: shop-mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-shop_db}
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-Shop_Prod_Root_Secret_2026!}
      REDIS_HOST: shop-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-Shop_Prod_Redis_Token_2026!}
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      shop-mysql:
        condition: service_healthy
      shop-redis:
        condition: service_healthy
    networks:
      - shop-internal

  # --------------------------------------------------------
  # 4. 表现层 Vue 3 + Vite 前端托管服务
  # --------------------------------------------------------
  shop-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: shop-frontend
    restart: always
    networks:
      - shop-internal

  # --------------------------------------------------------
  # 5. 边缘安全网关 Nginx 1.27 (全站唯一对外暴露 80/443 端口)
  # --------------------------------------------------------
  shop-nginx:
    image: nginx:1.27-alpine
    container_name: shop-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - uploads_data:/usr/share/nginx/uploads:ro
    depends_on:
      - shop-backend
      - shop-frontend
    networks:
      - shop-internal
